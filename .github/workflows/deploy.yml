name: Build & Deploy to GitHub Pages

on:
  push:
    branches: [astro_rebuild]
  workflow_dispatch:

# Allow the job to push the built site to the gh-pages branch.
permissions:
  contents: write

# Only run one deploy at a time; cancel superseded runs.
concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Fresh install re-resolves platform-specific optional deps (Rollup),
      # avoiding the npm optional-dependency bug that breaks `npm ci`.
      - name: Install dependencies
        run: |
          rm -f package-lock.json
          npm install --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Disable Jekyll (serve _astro/ assets)
        run: touch dist/.nojekyll

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          commit_message: "deploy: ${{ github.sha }}"
